  </defs>

   <path d="M220 124 C269 16 376 21 375 77 C374 128 294 121 230 133 C298 130 312 208 268 221 C233 229 224 158 220 139"/>

   <path d="M91 67 174 94 217 132 M349 67 266 94 223 132 M148 183 186 164 218 138 M292 183 254 164 222 138" stroke-dasharray="2 7"/>

 <form id="final-form" class="final-form" autocomplete="off" novalidate>
   <div class="final-digits">
    <label class="final-digit">
      <svg viewBox="0 0 52 44" aria-hidden="true">
       <path d="M7 4V37 M20 4V37 M33 4V37 M46 4V37" stroke="#455969" stroke-width="1"/>
       <g fill="#a6cbd0"><rect x="8" y="18" width="9" height="17" rx="1"/><rect x="21" y="6" width="9" height="17" rx="1"/><rect x="34" y="14" width="9" height="17" rx="1"/><rect x="44" y="26" width="5" height="9" rx="1"/></g>
      </svg>
      <input name="signal" aria-label="第一幅图：点亮的四轨长条有几条" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" placeholder="·" required>
    </label>
    <label class="final-digit">
      <svg viewBox="0 0 52 44" aria-hidden="true">
       <path d="M14 5V40M17 10H46M17 33H46" fill="none" stroke="#61798a" stroke-width="1"/>
       <circle cx="14" cy="10" r="3" fill="#9cc7cb"/><circle cx="14" cy="33" r="3" fill="#b4a6c6"/>
      </svg>
      <input name="dates" aria-label="第二幅图：时间线上点亮了几个日期" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" placeholder="·" required>
    </label>
    <label class="final-digit">
      <svg viewBox="0 0 52 44" aria-hidden="true">
       <path d="M26 4V40" stroke="#657b89" stroke-dasharray="2 3"/>
       <path d="M26 21 4 9 14 20 7 35 26 21 48 9 38 20 45 35Z" fill="none" stroke="#556a79" stroke-width=".8"/>
       <g fill="#b8a8c7"><circle cx="48" cy="9" r="2.3"/><circle cx="38" cy="20" r="2.3"/><circle cx="45" cy="35" r="2.3"/><circle cx="31" cy="24" r="2.3"/></g>
      </svg>
      <input name="orbit" aria-label="第三幅图：镜像后被点亮的紫色星点有几个" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" placeholder="·" required>
    </label>
    <label class="final-digit">
      <svg viewBox="0 0 52 44" aria-hidden="true">
       <path d="M6 6H45M6 18H45M6 30H45" stroke="#435362" stroke-width=".8"/>
       <path d="M30 10V30 Q30 40 22 35" fill="none" stroke="#a8c1c9" stroke-width="1.5"/>
       <path d="M18 40 32 37" fill="none" stroke="#b8a9c9" stroke-width="1.3"/>
      </svg>
      <input name="paper" aria-label="第四幅图：纸上添了几条修正笔画" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="off" placeholder="·" required>
    </label>
   </div>
   <button type="submit" class="final-confirm" aria-label="确认四位数字">
     <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="17" fill="none" stroke="#69838d" stroke-width="1"/><path d="M14 22H30M25 16L31 22 25 28" fill="none" stroke="#abc8cb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
   </button>
 </form>

 <g fill="none" stroke="url(#complete-gradient)" stroke-linecap="round" stroke-linejoin="round">
  <path d="M220 145 C181 39 58 30 63 105 C68 166 162 152 213 146 C138 153 120 249 174 251 C213 250 220 181 220 153" stroke-width="2.2"/>
  <path d="M220 145 C259 39 382 30 377 105 C372 166 278 152 227 146 C302 153 320 249 266 251 C227 250 220 181 220 153" stroke-width="2.2"/>
  <path d="M220 130V216 M216 131 205 106 M224 131 235 106" stroke-width="1.8"/>
  <path d="M78 104 C124 63 177 94 209 140 M362 104 C316 63 263 94 231 140 M156 226 C179 192 201 165 217 154 M284 226 C261 192 239 165 223 154" stroke-width=".9" opacity=".76"/>
  <path d="M89 135 159 134M351 135 281 134M172 65 204 123M268 65 236 123" stroke-dasharray="1 8" stroke-width="1"/>
 </g>
 <g fill="#b5d7d8">
  <circle cx="88" cy="105" r="3"/><circle cx="157" cy="77" r="2.5"/>
  <circle cx="146" cy="183" r="2.5"/><circle cx="179" cy="216" r="3"/>
 </g>
 <g fill="#c1acd1">
  <circle cx="352" cy="105" r="3"/><circle cx="283" cy="77" r="2.5"/>
  <circle cx="294" cy="183" r="2.5"/><circle cx="261" cy="216" r="3"/>
 </g>
 <g fill="none" stroke="#677d8b" stroke-width=".8"><path d="M220 18V38M220 269V286M29 145H48M392 145H411"/></g>
 <circle cx="220" cy="146" r="3" fill="#e0e5de"/>
 </svg>
 </div>
 <p id="final-status" class="sr-only" aria-live="polite"></p>
</div>
</section>
</main>
<script src="./metrics.js"></script>
<script>
(() => {
 const names=['keys','dates','mirror','margin'];
 const ready=names.every(name=>localStorage.getItem('nb036-misc-v3:'+name)==='1');
 if(!ready){location.replace('./');return}
 const form=document.querySelector('#final-form');
 const digits=[...form.querySelectorAll('input')];
 const reveal=document.querySelector('#final-reveal');
 const outline=document.querySelector('.final-outline');
 const status=document.querySelector('#final-status');
 const scene=document.querySelector('#final-scene');
 const finish=()=>{
   form.hidden=true;
   outline.setAttribute('hidden','');
   reveal.hidden=false;
   scene.classList.add('solved');
   status.textContent='四幅图的痕迹已经拼成完整夜蝶';
 };
 if(localStorage.getItem('nb036-misc-v3:final')==='1'){finish();return}
 const check=()=>{
   const code=digits.map(x=>x.value).join('');
   if(code.length!==4){status.textContent='还有未填写的数字';digits.find(x=>!x.value)?.focus();return}
   if(code!=='4241'){
     scene.classList.remove('incorrect');
     void scene.offsetWidth;
     scene.classList.add('incorrect');
     status.textContent='数量还没有对应上，重新数一数每幅图完成时发亮的部分';
     return;
   }
   localStorage.setItem('nb036-misc-v3:final','1');
   window.nightButterflyMetrics?.record('misc-final').catch(()=>{});
   finish();
 };
 form.addEventListener('submit',event=>{event.preventDefault();check()});
 digits.forEach((input,index)=>{
   input.addEventListener('input',()=>{
     input.value=input.value.replace(/[^0-9]/g,'').slice(-1);
     scene.classList.remove('incorrect');
     if(input.value&&index<digits.length-1)digits[index+1].focus();
   });
   input.addEventListener('keydown',event=>{
     if(event.key==='Backspace'&&!input.value&&index>0){
       digits[index-1].focus();digits[index-1].value='';
     }
     if(event.key==='ArrowLeft'&&index>0){event.preventDefault();digits[index-1].focus()}
     if(event.key==='ArrowRight'&&index<digits.length-1){event.preventDefault();digits[index+1].focus()}
   });
   input.addEventListener('paste',event=>{
     const value=event.clipboardData?.getData('text').replace(/\D/g,'')||'';
     if(value.length<2)return;
     event.preventDefault();
     for(let i=0;i<value.length&&index+i<digits.length;i++)digits[index+i].value=value[i];
     digits[Math.min(index+value.length,digits.length-1)].focus();
   });
 });
})();
</script>
</body>
</html>
