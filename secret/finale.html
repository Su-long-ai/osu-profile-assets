<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>036js</title><link rel="stylesheet" href="./silent.css?v=31">
</head>
<body>
<main class="shell">
<a class="breadcrumb" href="./" aria-label="返回四幅图">
  <svg viewBox="0 0 28 28" aria-hidden="true">
    <path d="M21 14H6m0 0 6-6m-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</a>
<section class="assembly-workbench" aria-label="将四幅图找到的蝴蝶翼片，按外形放入残缺蝶翼的相应位置">
  <div class="assembly-scene" id="assembly-scene">
    <div class="assembly-board" id="assembly-board" aria-label="残缺的蝴蝶">
      <button type="button" class="assembly-slot" data-slot="0" aria-label="左上方的蝶翼缺口"></button>
      <button type="button" class="assembly-slot" data-slot="1" aria-label="右上方的蝶翼缺口"></button>
      <button type="button" class="assembly-slot" data-slot="2" aria-label="左下方的蝶翼缺口"></button>
      <button type="button" class="assembly-slot" data-slot="3" aria-label="右下方的蝶翼缺口"></button>
      <svg class="assembly-spine" viewBox="0 0 280 230" aria-hidden="true">
        <path class="assembly-spine-line" d="M140 98V155M140 105Q131 86 122 80M140 105Q149 86 158 80" fill="none" stroke="#6e8791" stroke-linecap="round" stroke-width="1.2"/>
        <circle cx="140" cy="115" r="2" fill="#9fc4c7"/>
      </svg>
      <a class="assembly-home" id="assembly-home" href="./" aria-label="携带完整夜蝶返回图集" hidden></a>
    </div>
    <div class="assembly-tray" id="assembly-tray" aria-label="四片待拼接的蝶翼">
      <button class="assembly-piece" type="button" data-piece="margin" draggable="true" aria-label="纸张留下的蝶翼碎片"></button>
      <button class="assembly-piece" type="button" data-piece="keys" draggable="true" aria-label="四轨节奏留下的蝶翼碎片"></button>
      <button class="assembly-piece" type="button" data-piece="mirror" draggable="true" aria-label="镜像星点留下的蝶翼碎片"></button>
      <button class="assembly-piece" type="button" data-piece="dates" draggable="true" aria-label="两段时间留下的蝶翼碎片"></button>
    </div>
    <button type="button" class="assembly-endmark" id="assembly-endmark" hidden aria-label="将四片蝶翼拆开并重新拼合">
      <svg viewBox="0 0 280 32" aria-hidden="true">
        <path d="M0 16H100M180 16H280" stroke="#657d88" stroke-width=".8"/>
        <path d="M149 16a9 9 0 1 1-9-9h4m-4-4 4 4-4 4" fill="none" stroke="#a7c3c5" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </button>
    <p class="sr-only" id="assembly-status" role="status" aria-live="polite"></p>
  </div>
</section>
</main>
<script src="./metrics.js"></script>
<script src="./fragments.js?v=5"></script>
<script src="./assembly.js?v=6"></script>
</body>
</html>
