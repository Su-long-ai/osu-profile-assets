<script>
(() => {
  const names=['keys','dates','mirror','margin'];
  const tiles=[...document.querySelectorAll('.gallery .tile')];
  const seal=document.querySelector('#completion-seal');
  const finaleHref=seal.getAttribute('href');
  seal.querySelector('.seal-source-art').innerHTML=window.NBFragments.miniSeal();
  function refresh(){
    const found=names.map(name=>localStorage.getItem('nb036-misc-v3:'+name)==='1');
    tiles.forEach((tile,i)=>{
      if(!tile.dataset.originalLabel)tile.dataset.originalLabel=tile.getAttribute('aria-label');
      tile.classList.toggle('discovered',found[i]);
      tile.setAttribute('aria-label',tile.dataset.originalLabel+(found[i]?'，蝶翼已找到':''));
    });
    const collected=found.filter(Boolean).length;
    const ready=collected===names.length;
    seal.hidden=collected===0;
    seal.classList.toggle('ready',ready);
    // Before four discoveries this is a picture, not an inert-looking link.
    // Remove the actual destination as well as keyboard and pointer access.
    if(ready)seal.setAttribute('href',finaleHref);
    else seal.removeAttribute('href');
    seal.tabIndex=ready?0:-1;
    seal.setAttribute('aria-disabled',String(!ready));
    seal.querySelectorAll('.seal-shards > g[data-mini-part]').forEach(group=>{
      group.classList.toggle('found',localStorage.getItem('nb036-misc-v3:'+group.dataset.miniPart)==='1');
    });
    const joined=ready && localStorage.getItem('nb036-misc-v4:joined')==='1' &&
      localStorage.getItem('nb036-assembly-v2:replay')!=='1';
    seal.classList.toggle('complete',joined);
    seal.setAttribute('aria-label',joined?'夜蝶已完成，点击重新查看':
      ready?'四片翼已找到，点击拼合残缺夜蝶':'已经找到'+collected+'片蝶翼，继续探索其他图形');
  }
  refresh();
  addEventListener('pageshow',refresh);
  addEventListener('storage',refresh);
})();
</script>
