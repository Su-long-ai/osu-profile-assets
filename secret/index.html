<script>
(() => {
  const names=['keys','dates','mirror','margin'];
  const tiles=[...document.querySelectorAll('.gallery .tile')];
  const seal=document.querySelector('#completion-seal');
  const finaleHref=seal.getAttribute('href');
  seal.querySelector('.seal-source-art').innerHTML=window.NBFragments.miniSeal();
  function layoutArchiveMap(){
    const gallery=document.querySelector('.gallery');
    const map=document.querySelector('.archive-map');
    if(!gallery||!map)return;
    const gr=gallery.getBoundingClientRect();
    const sr=seal.getBoundingClientRect();
    const w=Math.max(1,gr.width),h=Math.max(1,gr.height);
    map.setAttribute('viewBox','0 0 '+w+' '+h);
    const cx=sr.left-gr.left+sr.width/2;
    const cy=sr.top-gr.top+sr.height/2;
    const roots={
      keys:[cx-sr.width*.12,cy-sr.height*.11],
      dates:[cx+sr.width*.12,cy-sr.height*.11],
      mirror:[cx-sr.width*.12,cy+sr.height*.11],
      margin:[cx+sr.width*.12,cy+sr.height*.11]
    };
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    const selectors={keys:'.tile-a',dates:'.tile-b',mirror:'.tile-c',margin:'.tile-d'};
    for(const name of names){
      const tile=document.querySelector(selectors[name]);
      const path=map.querySelector('[data-link="'+name+'"]');
      const dot=map.querySelector('[data-root="'+name+'"]');
      if(!tile||!path||!dot)continue;
      const tr=tile.getBoundingClientRect();
      const l=tr.left-gr.left,r=tr.right-gr.left,t=tr.top-gr.top,b=tr.bottom-gr.top;
      const [ex,ey]=roots[name];
      let sx=clamp(ex,l,r),sy=clamp(ey,t,b);
      if(sx>l&&sx<r&&sy>t&&sy<b){
        const dx=ex-(l+r)/2,dy=ey-(t+b)/2;
        if(Math.abs(dx/(tr.width||1))>Math.abs(dy/(tr.height||1)))sx=dx>0?r:l;
        else sy=dy>0?b:t;
      }
      const mx=sx+(ex-sx)*.52,my=sy+(ey-sy)*.52;
      path.setAttribute('d','M'+sx.toFixed(1)+' '+sy.toFixed(1)+' Q'+mx.toFixed(1)+' '+my.toFixed(1)+' '+ex.toFixed(1)+' '+ey.toFixed(1));
      dot.setAttribute('cx',ex.toFixed(1));dot.setAttribute('cy',ey.toFixed(1));
    }
  }
  function refresh(){
    const found=names.map(name=>localStorage.getItem('nb036-misc-v3:'+name)==='1');
    tiles.forEach((tile,i)=>{
      if(!tile.dataset.originalLabel)tile.dataset.originalLabel=tile.getAttribute('aria-label');
      tile.classList.toggle('discovered',found[i]);
      tile.setAttribute('aria-label',tile.dataset.originalLabel+(found[i]?'，蝶翼已找到':''));
    });
    const collected=found.filter(Boolean).length;
    const ready=collected===names.length;
    seal.hidden=!ready;
    seal.classList.toggle('ready',ready);
    // Before four discoveries this is a picture, not an inert-looking link.
    // Remove the actual destination as well as keyboard and pointer access.
    if(ready)seal.setAttribute('href',finaleHref);
    else seal.removeAttribute('href');
    seal.tabIndex=ready?0:-1;
    seal.setAttribute('aria-disabled',String(!ready));
    const joined=ready && localStorage.getItem('nb036-misc-v4:joined')==='1' &&
      localStorage.getItem('nb036-assembly-v2:replay')!=='1';
    seal.classList.toggle('complete',joined);
    document.querySelector('.gallery')?.classList.toggle('joined',joined);
    requestAnimationFrame(layoutArchiveMap);
    seal.setAttribute('aria-label',joined?'夜蝶已完成，点击重新查看':
      ready?'四片翼已找到，点击拼合残缺夜蝶':'已经找到'+collected+'片蝶翼，继续探索其他图形');
  }
  refresh();
  addEventListener('pageshow',refresh);
  addEventListener('storage',refresh);
  addEventListener('resize',()=>requestAnimationFrame(layoutArchiveMap));
})();
</script>
