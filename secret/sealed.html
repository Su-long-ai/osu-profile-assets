<script>
(() => {
  const button = document.querySelector('#scribble');
  const note = document.querySelector('#last-line');
  function toggle() {
    note.hidden = !note.hidden;
    button.setAttribute('aria-expanded', String(!note.hidden));
    if (!note.hidden) NB.notice('margin');
  }
  button.addEventListener('click', toggle);
})();
</script>
