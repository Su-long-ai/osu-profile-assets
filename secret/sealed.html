<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>036js</title><link rel="stylesheet" href="./silent.css?v=20"></head><body>
<main class="shell">
<a class="breadcrumb" href="./" aria-label="返回图集"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M21 14H6m0 0 6-6m-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<section class="workbench" aria-label="可移动的笔迹"><div class="visual">
<div class="paper-wrap">
<svg class="paper" id="paper" viewBox="0 0 380 290" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<path d="M40 19 H337 V268 H40 Z" stroke="#354554" stroke-width=".8" fill="#151c25"/>
<path class="line" d="M62 71 H317 M62 115 H317 M62 159 H317 M62 203 H317 M62 247 H317"/>
<path stroke="#4e6675" stroke-width=".8" fill="none" d="M80 111 H190 M206 111 H273" opacity=".58"/>
<g id="descender">
  <circle class="smudge" cx="199" cy="130" r="2.7"/>
  <path class="ink" d="M199 139 V165 Q197 183 182 175"/>
</g>
<circle id="ink-target" cx="183" cy="190" r="5" fill="none" stroke="#718294" stroke-width=".65" stroke-dasharray="1 5"/>
<path class="correction" id="correction" d="M173 193 C181 188 189 188 197 186" hidden/>
<path stroke="#586f81" stroke-width=".65" opacity=".42" d="M76 226H143" />
</svg>
<button class="note-button" id="scribble" type="button" aria-pressed="false" aria-label="触碰纸张中央的墨迹以查看笔画修正"></button>
</div>
</div></section></main>
<script src="./metrics.js"></script><script src="./case.js"></script><script src="./fragments.js?v=4"></script>
<script>
(() => {
  const button=document.querySelector('#scribble');
  const paper=document.querySelector('#paper');
  const correction=document.querySelector('#correction');
  const visualKey='nb036-visual-v1:paper';
  const saved=localStorage.getItem(visualKey);
  let fixed=saved===null?NB.seen('margin'):saved==='1';
  let pointer=null;
  let lastPointer=-Infinity;

  function paint(){
    paper.classList.toggle('corrected',fixed);
    correction.toggleAttribute('hidden',!fixed);
    button.setAttribute('aria-pressed',String(fixed));
  }
  function apply(next){
    fixed=next;
    localStorage.setItem(visualKey,fixed?'1':'0');
    paper.classList.remove('ink-moving');
    paper.style.removeProperty('--ink-shift-y');
    paper.style.removeProperty('--ink-shift-x');
    paint();
    if(fixed)NB.notice('margin');
  }

  // A drawn correction can be pulled toward its faint endpoint. A short
  // tap and native keyboard activation remain for touch accessibility.
  button.addEventListener('pointerdown',event=>{
    if(event.button!==0)return;
    pointer={id:event.pointerId,x:event.clientX,y:event.clientY,moved:false,up:0};
    button.setPointerCapture(event.pointerId);
  });
  button.addEventListener('pointermove',event=>{
    if(!pointer||pointer.id!==event.pointerId)return;
    const dx=event.clientX-pointer.x,dy=event.clientY-pointer.y;
    if(Math.hypot(dx,dy)>7)pointer.moved=true;
    if(!pointer.moved)return;
    const scale=380/paper.getBoundingClientRect().width;
    const shiftY=Math.max(-6,Math.min(16,dy*scale));
    const shiftX=Math.max(-7,Math.min(5,dx*scale));
    pointer.up=shiftY;
    paper.classList.add('ink-moving');
    paper.style.setProperty('--ink-shift-y',shiftY+'px');
    paper.style.setProperty('--ink-shift-x',shiftX+'px');
  });
  button.addEventListener('pointerup',event=>{
    if(!pointer||pointer.id!==event.pointerId)return;
    const active=pointer;
    pointer=null;
    lastPointer=performance.now();
    if(active.moved){
      if(active.up>=10)apply(true);
      else apply(fixed);
    }else apply(!fixed);
  });
  button.addEventListener('pointercancel',()=>{
    pointer=null;
    paper.classList.remove('ink-moving');
    paper.style.removeProperty('--ink-shift-y');
    paper.style.removeProperty('--ink-shift-x');
  });
  button.addEventListener('click',event=>{
    if(event.detail>0&&performance.now()-lastPointer<700)return;
    apply(!fixed);
  });
  paint();
})();
</script></body></html>
