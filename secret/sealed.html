</main><script src="./metrics.js"></script><script src="./case.js"></script><script>
(() => {
 NB.renderPieces();
 const found=NB.progress().length;
 const status=document.getElementById('status');
 const form=document.getElementById('verify-form');
 const code=document.getElementById('code');
 const response=document.getElementById('code-feedback');
 const ending=document.getElementById('ending');
 const trueEnding=document.getElementById('true-ending');
 function sync(){
   if(NB.solved('final')){
     form.hidden=true;
     ending.hidden=false;
     status.textContent='文件能打开了。';
     if(found===3){NB.complete('true');trueEnding.hidden=false}
   }else{
     form.hidden=found<2;
     status.textContent=found+' / 3 EVIDENCE FILES · '+(found>=2?'可以对照那几段残缺的数字了':'至少看完两份文件');
   }
 }
 form.addEventListener('submit',event=>{
   event.preventDefault();
   if(found<2)return;
   if(code.value.trim()==='0529'){
     NB.complete('final');
     response.textContent='校验通过。';
     sync();
     NB.reveal(ending);
   }else{
     response.textContent='对不上，再看看原文件。';
     code.select();
   }
 });
 sync();
})();
</script></body></html>
