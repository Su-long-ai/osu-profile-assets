<section class="workbench" aria-label="可移动的笔迹"><div class="visual">
<div class="paper-wrap">
<svg class="paper" id="paper" viewBox="0 0 380 290" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<path d="M40 19 H337 V268 H40 Z" stroke="#354554" stroke-width=".8" fill="#151c25"/>
<path class="line" d="M62 71 H317 M62 115 H317 M62 159 H317 M62 203 H317 M62 247 H317"/>
<path stroke="#4e6675" stroke-width=".8" fill="none" d="M80 111 H190 M206 111 H273" opacity=".58"/>
<circle class="smudge" cx="199" cy="130" r="2.7"/>
<path class="ink-fixed" d="M199 139V165"/>

  <path class="ink" d="M199 165Q197 183 182 175"/>
</g>

</svg>
<button class="note-button" id="scribble" type="button" aria-pressed="false" aria-label="选取脱落的 j 字弯钩"></button>
<button class="ink-socket" id="ink-socket" type="button" aria-label="将弯钩接回竖干末端" hidden></button>
<p class="sr-only" id="paper-status" role="status" aria-live="polite"></p>
</div>
</div></section></main>
<script src="./metrics.js"></script><script src="./case.js"></script><script src="./fragments.js?v=10"></script>
<script>
(() => {
  const button=document.querySelector('#scribble');
  const socket=document.querySelector('#ink-socket');
  const paper=document.querySelector('#paper');
  const correction=document.querySelector('#correction');
  const status=document.querySelector('#paper-status');
  const visualKey='nb036-visual-v1:paper';
  const saved=localStorage.getItem(visualKey);
  const solvedAtLoad=NB.seen('margin');
  let fixed=solvedAtLoad?true:(saved===null?false:saved==='1');
  if(solvedAtLoad)localStorage.setItem(visualKey,'1');
  let armed=false;
  let socketReadyAt=0;
  let pointer=null;
  let lastPointer=-Infinity;

  function paint(){
    paper.classList.toggle('corrected',fixed);
    paper.classList.toggle('ink-armed',armed&&!fixed);
    correction.toggleAttribute('hidden',!fixed);
    socket.hidden=!armed||fixed;
    button.setAttribute('aria-pressed',String(armed||fixed));
    const archival=NB.seen('margin');
    document.querySelector('.paper-wrap').classList.toggle('archival',archival);
    button.disabled=archival;
    button.tabIndex=archival?-1:0;
    button.setAttribute('aria-label',archival?'j 字弯钩已接回':'选取脱落的 j 字弯钩');
  }
  function apply(next){
    if(!next&&NB.seen('margin'))return;
    fixed=next;
    armed=false;
    socketReadyAt=0;
    localStorage.setItem(visualKey,fixed?'1':'0');
    if(fixed)NB.notice('margin');
    paper.classList.remove('ink-moving');
    paper.style.removeProperty('--ink-shift-y');
    paper.style.removeProperty('--ink-shift-x');
    paint();
    status.textContent=fixed?'脱落弯钩已接回 j 字竖干':'弯钩回到脱落位置';
  }
  function toggleInk(){
    if(NB.seen('margin'))return;
    if(fixed){apply(false);return}
    armed=!armed;
    socketReadyAt=armed?performance.now()+320:0;
    paint();
    status.textContent=armed?'弯钩已选取，可以触碰接点或向右上拖动':'已放下弯钩';
  }

  // Mouse, touch and keyboard all share the same physical rule:
  // either drag the loose stroke toward its registration mark,
  // or pick the stroke and touch the mark. No one-tap completion.
  button.addEventListener('pointerdown',event=>{
    if(NB.seen('margin')||event.button!==0)return;
    pointer={id:event.pointerId,x:event.clientX,y:event.clientY,moved:false,up:0,dx:0};
    button.setPointerCapture(event.pointerId);
  });
  button.addEventListener('pointermove',event=>{
    if(!pointer||pointer.id!==event.pointerId)return;
    const dx=event.clientX-pointer.x,dy=event.clientY-pointer.y;
    if(Math.hypot(dx,dy)>7)pointer.moved=true;
    if(!pointer.moved)return;
    const scale=380/paper.getBoundingClientRect().width;
    const shiftY=Math.max(-36,Math.min(8,dy*scale));
    const shiftX=Math.max(-8,Math.min(42,dx*scale));
    pointer.up=shiftY;
    pointer.dx=shiftX;
    paper.classList.add('ink-moving');
    paper.style.setProperty('--ink-shift-y',shiftY+'px');
    paper.style.setProperty('--ink-shift-x',shiftX+'px');
  });
  button.addEventListener('pointerup',event=>{
    if(!pointer||pointer.id!==event.pointerId)return;
    const active=pointer;
    pointer=null;
    lastPointer=performance.now();
    if(active.moved){
      if(active.dx>=23&&active.dx<=39&&active.up<=-14&&active.up>=-31)apply(true);
      else {
        paper.classList.remove('ink-moving');
        paper.style.removeProperty('--ink-shift-y');
        paper.style.removeProperty('--ink-shift-x');
        paint();
        status.textContent='弯钩尚未与竖干末端对齐';
      }
    }else toggleInk();
  });
  button.addEventListener('pointercancel',()=>{
    pointer=null;
    paper.classList.remove('ink-moving');
    paper.style.removeProperty('--ink-shift-y');
    paper.style.removeProperty('--ink-shift-x');
    paint();
  });
  button.addEventListener('click',event=>{
    // Pointerup already owns mouse/touch activation. Some touch browsers emit
    // a synthetic click with detail=0, so gate by time rather than detail.
    if(performance.now()-lastPointer<700)return;
    toggleInk();
  });
  socket.addEventListener('click',()=>{
    // Ignore the synthetic click generated by the same touch that revealed
    // this socket. A later deliberate tap/click is accepted.
    if(armed&&!fixed&&performance.now()>=socketReadyAt)apply(true);
  });
  paint();
})();
</script><script src="./registration-residue.js?v=2"></script></body></html>
