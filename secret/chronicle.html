<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>036js</title><link rel="stylesheet" href="./silent.css?v=32"></head>
<body><main class="shell">
<a class="breadcrumb" href="./" aria-label="返回图集"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M21 14H6m0 0 6-6m-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<a class="utility source-reference" href="https://osu.ppy.sh/users/29089125#me" aria-label="回看 osu! 主页的真实成长记录"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M7 5V21M11 7H21M11 19H21" stroke="currentColor" fill="none" stroke-width=".85"/><circle cx="7" cy="7" r="1.7" fill="#9fc9cf"/><circle cx="7" cy="19" r="1.7" fill="#b7a6ca"/></svg></a>
<section class="workbench">
 <div class="visual">
  <div class="dates archive-dates" aria-label="从主页成长记录找到两次五段通过日期，按时间顺序连接">
   <span class="archive-rail" aria-hidden="true"></span>
   <button class="date-row" data-day="r00" type="button" aria-pressed="false" aria-label="2025-03-07"><time datetime="2025-03-07">2025.03.07</time><span class="mark" aria-hidden="true"></span></button>
   <button class="date-row" data-day="r01" type="button" aria-pressed="false" aria-label="2025-05-27"><time datetime="2025-05-27">2025.05.27</time><span class="mark" aria-hidden="true"></span></button>
   <button class="date-row" data-day="r02" type="button" aria-pressed="false" aria-label="2025-06-14"><time datetime="2025-06-14">2025.06.14</time><span class="mark" aria-hidden="true"></span></button>
   <button class="date-row" data-day="l03" type="button" aria-pressed="false" aria-label="2025-06-20"><time datetime="2025-06-20">2025.06.20</time><span class="mark" aria-hidden="true"></span></button>
   <button class="date-row" data-day="r34" type="button" aria-pressed="false" aria-label="2025-12-08"><time datetime="2025-12-08">2025.12.08</time><span class="mark" aria-hidden="true"></span></button>
   <button class="date-row" data-day="ln" type="button" aria-pressed="false" aria-label="2025-12-26"><time datetime="2025-12-26">2025.12.26</time><span class="mark" aria-hidden="true"></span></button>
   <button class="date-row" data-day="regular" type="button" aria-pressed="false" aria-label="2026-05-29"><time datetime="2026-05-29">2026.05.29</time><span class="mark" aria-hidden="true"></span></button>
   <div id="time-thread" class="time-thread" aria-hidden="true">
     <span class="time-thread-path"></span><span class="time-thread-progress"></span>
     <span class="time-thread-knob"></span><span id="week-marks" class="week-marks"></span>
   </div>
   <output id="interval" class="interval" aria-label="日期间隔：154天，恰好22周" hidden>154</output>
   <p class="sr-only" id="time-status" role="status" aria-live="polite"></p>
  </div>
 </div>
</section>
</main>
<script src="./metrics.js"></script><script src="./case.js"></script><script src="./fragments.js?v=5"></script>
<script>
(() => {
  const dates=document.querySelector('.dates');
  const rows=[...dates.querySelectorAll('.date-row')];
  const early=dates.querySelector('[data-day="ln"]');
  const later=dates.querySelector('[data-day="regular"]');
  const interval=document.querySelector('#interval');
  const status=document.querySelector('#time-status');
  const thread=document.querySelector('#time-thread');
  const marks=document.querySelector('#week-marks');
  const days=Math.round((Date.parse(later.querySelector('time').dateTime)-Date.parse(early.querySelector('time').dateTime))/86400000);
  const weeks=Math.floor(days/7);
  const weeksLabel=days%7?weeks+'周另'+days%7+'天':'恰好'+weeks+'周';
  const notches=Array.from({length:weeks},(_,i)=>{
    const mark=document.createElement('i');mark.style.top=((i+1)*7*100/days)+'%';marks.append(mark);return mark;
  });
  interval.textContent=String(days);
  interval.setAttribute('aria-label',days+'天，'+weeksLabel);
  const key='nb036-visual-v3:date-start';
  let solved=NB.seen('dates');
  const saved=localStorage.getItem(key);
  let selected=solved?null:rows.find(r=>r.dataset.day===(saved==='1'?'ln':saved))||null;
  let drag=null, lastPointer=-Infinity, feedbackTimer;
  function midpoint(row){const r=row.getBoundingClientRect();return r.top+r.height/2}
  function position(){
    const r=dates.getBoundingClientRect();
    const from=solved?early:selected;
    const target=solved?later:drag?.target;
    thread.hidden=!from||!target||from===target;
    if(thread.hidden)return;
    const a=midpoint(from),b=midpoint(target);
    thread.style.top=(Math.min(a,b)-r.top)+'px';
    thread.style.height=Math.abs(b-a)+'px';
    thread.classList.toggle('reverse',b<a);
    thread.style.setProperty('--time-progress','1');
  }
  function paint(){
    dates.classList.toggle('has-one',!!selected&&!solved);
    dates.classList.toggle('has-both',solved);
    rows.forEach(row=>{
      const on=solved?(row===early||row===later):row===selected;
      row.classList.toggle('selected',on);row.setAttribute('aria-pressed',String(on));
    });
    interval.hidden=!solved;
    marks.hidden=!solved;
    notches.forEach(mark=>mark.classList.toggle('active',solved));
    if(solved){localStorage.removeItem(key);status.textContent=days+'天，'+weeksLabel}
    position();
  }
  function begin(row){
    selected=row;localStorage.setItem(key,row.dataset.day);paint();status.textContent='已选择一个日期，连接对应的另一条记录';
  }
  function choose(row){
    if(solved)return;
    clearTimeout(feedbackTimer);
    rows.forEach(r=>r.classList.remove('missed-start'));
    if(!selected){begin(row);return}
    if(selected===row){selected=null;localStorage.removeItem(key);paint();return}
    if(selected===early&&row===later){
      solved=true;selected=null;paint();NB.notice('dates');return;
    }
    const previous=selected;selected=null;localStorage.removeItem(key);paint();
    previous.classList.add('missed-start');row.classList.add('missed-start');
    feedbackTimer=setTimeout(()=>rows.forEach(r=>r.classList.remove('missed-start')),500);
    status.textContent='两条记录未能接合，请回看主页的成长记录';
  }
  function locate(y){return rows.reduce((a,b)=>Math.abs(midpoint(b)-y)<Math.abs(midpoint(a)-y)?b:a)}
  rows.forEach(row=>{
    row.addEventListener('pointerdown',event=>{
      if(solved||event.button!==0)return;
      drag={id:event.pointerId,row,x:event.clientX,y:event.clientY,moved:false,target:null};
      row.setPointerCapture(event.pointerId);
    });
    row.addEventListener('pointermove',event=>{
      if(!drag||drag.id!==event.pointerId)return;
      if(!drag.moved&&Math.hypot(event.clientX-drag.x,event.clientY-drag.y)>8){
        drag.moved=true;begin(row);
      }
      if(!drag.moved)return;
      drag.target=locate(event.clientY);position();
    });
    row.addEventListener('pointerup',event=>{
      if(!drag||drag.id!==event.pointerId)return;
      const action=drag;drag=null;lastPointer=performance.now();
      if(!action.moved){choose(row);return}
      const target=locate(event.clientY);
      if(target!==row&&Math.abs(midpoint(target)-event.clientY)<=target.offsetHeight/2+3)choose(target);
      else paint();
    });
    row.addEventListener('pointercancel',()=>{drag=null;paint()});
    row.addEventListener('click',event=>{if(event.detail>0&&performance.now()-lastPointer<650)return;choose(row)});
  });
  addEventListener('resize',position);
  paint();
})();
</script></body></html>
