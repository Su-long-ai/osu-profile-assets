</main><script src="./metrics.js"></script><script src="./case.js"></script><script>
(() => {
 const order=['four','seven','ln','regular'];
 const feedback=document.getElementById('feedback');
 const solution=document.getElementById('solution');
 let found=[];
 function update(){
   document.querySelectorAll('[data-stamp]').forEach(b=>b.classList.toggle('done',found.includes(b.dataset.stamp)));
   feedback.textContent=found.length+' / 4';
 }
 function pick(id){
   if(NB.solved('chronicle'))return;
   if(id===order[found.length])found.push(id);
   else{found=id===order[0]?[id]:[]}
   update();
   if(found.length===4){NB.complete('chronicle');feedback.textContent='排好了。';NB.reveal(solution)}
 }
 document.querySelectorAll('[data-stamp]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.stamp)));
 if(NB.solved('chronicle')){found=order.slice();update();NB.reveal(solution)}
})();
</script></body></html>
