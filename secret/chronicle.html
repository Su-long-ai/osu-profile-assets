<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>036js</title><link rel="stylesheet" href="./silent.css?v=16"></head>
<body><main class="shell">
<a class="breadcrumb" href="./" aria-label="返回图集"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M21 14H6m0 0 6-6m-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<section class="workbench">
 <div class="visual">
  <div class="dates" aria-label="沿时间顺序连接两次实际成绩记录">
   <button class="date-row" data-day="ln" type="button" aria-label="2025年12月26日，长音符通关记录"><time datetime="2025-12-26">2025.12.26</time><span class="mark" aria-hidden="true"></span></button>
   <button class="date-row" data-day="regular" type="button" aria-label="2026年5月29日，通常通关记录"><time datetime="2026-05-29">2026.05.29</time><span class="mark" aria-hidden="true"></span></button>
   <div id="time-thread" class="time-thread" aria-hidden="true">
     <span class="time-thread-path"></span><span class="time-thread-progress"></span>
     <span class="time-thread-knob"></span><span id="week-marks" class="week-marks"></span>
   </div>
   <output id="interval" class="interval" aria-label="日期间隔：154天，恰好22周" hidden>154</output>
   <p class="sr-only" id="time-status" role="status" aria-live="polite"></p>
  </div>
 </div>
</section>
</main>
<script src="./metrics.js"></script><script src="./case.js"></script><script src="./fragments.js?v=1"></script>
<script>
(() => {
  const dates=document.querySelector('.dates');
  const rows=[...document.querySelectorAll('.date-row')];
  const [early,later]=rows;
  const interval=document.querySelector('#interval');
  const status=document.querySelector('#time-status');
  const thread=document.querySelector('#time-thread');
  const marks=document.querySelector('#week-marks');
  const from=new Date(early.querySelector('time').dateTime+'T00:00:00Z');
  const to=new Date(later.querySelector('time').dateTime+'T00:00:00Z');
  const days=Math.round((to-from)/86400000);
  const weeks=Math.max(0,Math.floor(days/7));
  const weeksLabel=days%7?weeks+'周另'+days%7+'天':'恰好'+weeks+'周';
  // Notches represent actual elapsed seven-day intervals; 154 days has 22.
  const notches=Array.from({length:weeks},(_,i)=>{
    const mark=document.createElement('i');
    mark.style.top=((i+1)*7*100/days)+'%';
    marks.append(mark);
    return mark;
  });
  interval.textContent=String(days);
  interval.setAttribute('aria-label',days+'天，'+weeksLabel);
  let selected=false;
  let fraction=0;
  let solved=NB.seen('dates');
  let drag=null;

  function position(){
    const a=early.getBoundingClientRect(),b=later.getBoundingClientRect(),r=dates.getBoundingClientRect();
    thread.style.top=(a.top+a.height/2-r.top)+'px';
    thread.style.height=(b.top+b.height/2-a.top-a.height/2)+'px';
  }
  function paint(){
    const amount=solved?1:fraction;
    thread.style.setProperty('--time-progress',String(amount));
    dates.classList.toggle('has-one',selected&&!solved);
    dates.classList.toggle('has-both',solved);
    early.classList.toggle('selected',selected||solved);
    later.classList.toggle('selected',solved);
    notches.forEach((mark,i)=>mark.classList.toggle('active',(i+1)*7/days<=amount+.00001));
    interval.hidden=!solved;
    status.textContent=solved?days+'天，'+weeksLabel:'';
    position();
  }
  function begin(){
    if(solved)return;
    selected=true;fraction=0;paint();
    status.textContent='时间起点已选中，连接至较晚的记录';
  }
  function finish(){
    if(solved||!selected)return;
    solved=true;fraction=1;
    paint();
    NB.notice('dates');
  }
  early.addEventListener('click',begin);
  later.addEventListener('click',()=>{
    if(!selected&&!solved){
      later.classList.add('missed-start');
      setTimeout(()=>later.classList.remove('missed-start'),420);
      status.textContent='先从较早日期开始';
      return;
    }
    finish();
  });

  // Drag the earlier date toward the later one; tapping the two dates is
  // still available for keyboard, screen reader and touch accessibility.
  early.addEventListener('pointerdown',event=>{
    if(solved||event.button>0)return;
    begin();
    drag={id:event.pointerId,y:event.clientY,moved:false};
    early.setPointerCapture(event.pointerId);
  });
  early.addEventListener('pointermove',event=>{
    if(!drag||drag.id!==event.pointerId)return;
    const distance=later.getBoundingClientRect().top+later.offsetHeight/2-drag.y;
    if(Math.abs(event.clientY-drag.y)>7)drag.moved=true;
    if(!drag.moved)return;
    fraction=Math.max(0,Math.min(1,(event.clientY-drag.y)/distance));
    paint();
  });
  early.addEventListener('pointerup',event=>{
    if(!drag||drag.id!==event.pointerId)return;
    const wasDrag=drag.moved;
    drag=null;
    if(wasDrag&&fraction>=.85)finish();
    else if(!solved){fraction=0;paint()}
  });
  early.addEventListener('pointercancel',()=>{
    drag=null;
    if(!solved){fraction=0;paint()}
  });
  addEventListener('resize',position);
  paint();
})();
</script></body></html>
