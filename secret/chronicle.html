<script>
(() => {
  const marked = new Set();
  const rows = [...document.querySelectorAll('[data-day]')];
  const aside = document.querySelector('#days-apart');
  function inspect(row) {
    marked.add(row.dataset.day);
    row.classList.add('touched');
    if (marked.size === 2) {
      aside.hidden = false;
      NB.notice('dates');
    }
  }
  rows.forEach(row => row.addEventListener('click', () => inspect(row)));
  if (NB.seen('dates')) aside.hidden = false;
})();
</script>
