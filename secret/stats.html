<script src="./metrics.js"></script>
<script>
(()=>{
 const current=["misc-keys","misc-dates","misc-mirror","misc-margin","misc-assembly"];
 const history=["misc-final","case-signal","case-chronicle","case-orbit","case-final","case-true","b-side","c-side","d-side","star-whisper","e-side"];
 const pending=new Set();
 const loaded=new Set();
 const values=new Map();
 const sourceIds=["misc-keys","misc-dates","misc-mirror","misc-margin"];
 function updateOrbit(){
   const known=sourceIds.map(id=>values.get(id)).filter(Number.isFinite);
   const max=Math.max(1,...known);
   const dirs={
     "misc-keys":[-1,-1],"misc-dates":[1,-1],
     "misc-mirror":[-1,1],"misc-margin":[1,1]
   };
   for(const id of sourceIds){
     const line=document.querySelector('[data-stage="'+id+'"]');
     const tip=document.querySelector('[data-tip="'+id+'"]');
     if(!line||!tip)continue;
     const value=values.get(id);
     const knownValue=Number.isFinite(value);
     const ratio=knownValue?Math.max(0,Math.min(1,value/max)):0;
     const len=knownValue?18+42*ratio:18;
     const [dx,dy]=dirs[id];
     const norm=Math.SQRT1_2;
     const x=90+dx*norm*len,y=90+dy*norm*len;
     line.setAttribute('x2',x.toFixed(1));line.setAttribute('y2',y.toFixed(1));
     tip.setAttribute('cx',x.toFixed(1));tip.setAttribute('cy',y.toFixed(1));
     line.classList.toggle('unknown',!knownValue);
     tip.classList.toggle('unknown',!knownValue);
   }
   const assembly=values.get("misc-assembly");
   const ring=document.querySelector('.stats-assembly-ring');
   if(ring){
     const ratio=Number.isFinite(assembly)?Math.max(0,Math.min(1,assembly/max)):0;
     ring.setAttribute('r',(8+10*ratio).toFixed(1));
     ring.classList.toggle('unknown',!Number.isFinite(assembly));
   }
 }
 async function populate(ids){
   await Promise.all(ids.map(async id=>{
     if(pending.has(id)||loaded.has(id))return;
     pending.add(id);
     const entry=document.getElementById(id);
     const label=entry.closest('.stats-row').getAttribute('aria-label');
     entry.textContent='·';
     entry.setAttribute('aria-label',label+'，读取中');
     try{
       const value=await nightButterflyMetrics.count(id);
       if(!Number.isFinite(value)||value<0)throw new Error('Unknown count');
       entry.textContent=Number(value).toLocaleString('zh-CN');
       entry.setAttribute('aria-label',label+'，浏览器首次成功上报次数 '+value+'，非独立人数');
       values.set(id,Number(value));
       updateOrbit();
       loaded.add(id);
     }catch{
       entry.textContent='—';
       entry.setAttribute('aria-label',label+'，暂不可读取，不代表零次');
       values.delete(id);
       updateOrbit();
     }finally{pending.delete(id)}
   }));
 }
 void populate(current);
 const old=document.querySelector('.stats-history');
 old.addEventListener('toggle',()=>{
   if(old.open)void populate(history);
 });
 addEventListener('online',()=>{
   void populate(current);
   if(old.open)void populate(history);
 });
})();
</script>
