<div class="stats-row" aria-label="笔迹变化被发现"><svg viewBox="0 0 44 44" aria-hidden="true"><path d="M5 9H39M5 19H39M5 29H39M5 39H39" stroke="#465667" stroke-width=".7"/><circle cx="25" cy="22" r="1.7" fill="#a8c5ce"/><path d="M25 26V37Q25 42 19 38" fill="none" stroke="#a8c5ce" stroke-width="1.4"/></svg><span class="bar" aria-hidden="true"></span><output id="misc-margin" aria-label="人数">·</output></div>

<details class="stats-history">
<summary aria-label="展开旧版历史统计"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V4l-5 5 5 5V10a8 8 0 1 1 3 8" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
<div class="stats-row" aria-label="历史数字终章"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5H16M4 10H16M4 15H16" stroke="#7f95a5" stroke-width=".8" fill="none"/></svg><span class="bar" aria-hidden="true"></span><output id="misc-final">·</output></div>

<div class="stats-row" aria-label="旧版日期谜题"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3" fill="none" stroke="#7f95a5" stroke-width=".8"/></svg><span class="bar" aria-hidden="true"></span><output id="case-chronicle">·</output></div>
<div class="stats-row" aria-label="旧版镜像谜题"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4" fill="none" stroke="#7f95a5" stroke-width=".8"/></svg><span class="bar" aria-hidden="true"></span><output id="case-orbit">·</output></div>
<div class="stats-row" aria-label="旧版合卷"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2" fill="none" stroke="#7f95a5" stroke-width=".8"/></svg><span class="bar" aria-hidden="true"></span><output id="case-final">·</output></div>

<div class="stats-row" aria-label="更早的 B"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4" fill="none" stroke="#7f95a5" stroke-width=".8"/></svg><span class="bar" aria-hidden="true"></span><output id="b-side">·</output></div>
<div class="stats-row" aria-label="更早的 C"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2" fill="none" stroke="#7f95a5" stroke-width=".8"/></svg><span class="bar" aria-hidden="true"></span><output id="c-side">·</output></div>
<div class="stats-row" aria-label="更早的 D"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3" fill="none" stroke="#7f95a5" stroke-width=".8"/></svg><span class="bar" aria-hidden="true"></span><output id="d-side">·</output></div>
<div class="stats-row" aria-label="旧版星图密语"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4" fill="none" stroke="#7f95a5" stroke-width=".8"/></svg><span class="bar" aria-hidden="true"></span><output id="star-whisper">·</output></div>
<div class="stats-row" aria-label="更早的 E"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2" fill="none" stroke="#7f95a5" stroke-width=".8"/></svg><span class="bar" aria-hidden="true"></span><output id="e-side">·</output></div>
</details>
</div>
</section>
</main>
<script src="./metrics.js"></script>
<script>
(()=>{
 const current=["misc-keys","misc-dates","misc-mirror","misc-margin","misc-assembly"];
 const history=["misc-final","case-signal","case-chronicle","case-orbit","case-final","case-true","b-side","c-side","d-side","star-whisper","e-side"];
 async function populate(ids){
   const values=await Promise.allSettled(ids.map(id=>nightButterflyMetrics.count(id)));
   values.forEach((result,i)=>{
     if(result.status==='fulfilled' && Number.isFinite(result.value)){
       document.getElementById(ids[i]).textContent=Number(result.value).toLocaleString('zh-CN');
     }
   });
 }
 void populate(current);
 const old=document.querySelector('.stats-history');
 old.addEventListener('toggle',()=>{
   if(!old.open || old.dataset.loaded) return;
   old.dataset.loaded='1';
   void populate(history);
 });
})();
</script>
</body></html>
