</main><script src="./metrics.js"></script><script src="./case.js"></script><script>
(() => {
 const answer=['v3','v5','v1','v7'];
 const nodes=[...document.querySelectorAll('[data-star]')];
 const feedback=document.getElementById('feedback');
 const solution=document.getElementById('solution');
 let progress=[];
 function draw(){for(const n of nodes)n.classList.toggle('selected',progress.includes(n.dataset.star))}
 function pick(id){
   if(NB.solved('orbit'))return;
   progress=(id===answer[progress.length])?[...progress,id]:(id===answer[0]?[id]:[]);
   draw();
   feedback.textContent=progress.length+' / 4';
   if(progress.length===4){NB.complete('orbit');feedback.textContent='对上了。';NB.reveal(solution)}
 }
 for(const star of nodes){
   star.addEventListener('click',()=>pick(star.dataset.star));
   star.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){event.preventDefault();pick(star.dataset.star)}
   });
 }
 if(NB.solved('orbit')){progress=answer.slice();draw();feedback.textContent='对上了。';NB.reveal(solution)}
})();
</script></body></html>
