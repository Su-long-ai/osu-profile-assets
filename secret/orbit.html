<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>036js</title><link rel="stylesheet" href="./silent.css?v=3"></head><body>
<main class="shell"><a class="breadcrumb" href="./" aria-label="返回图集"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M21 14H6m0 0 6-6m-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<section class="workbench" aria-label="蝴蝶星点"><div class="visual"><div class="star-wrap">
<svg class="star-field" viewBox="0 0 280 160" id="star-map" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="蝴蝶星图，中间的虚线可交互">
<path class="edge" d="M140 88 L42 43 L88 79 L55 124 L112 100 L140 88 L168 100 L192 79 L238 43 L259 68 L225 124 L198 123 L140 88"/>
<line class="axis" x1="140" y1="12" x2="140" y2="146"/>
<g class="star"><circle class="marker cyan" cx="42" cy="43" r="4"/><circle class="marker cyan" cx="88" cy="79" r="4"/><circle class="marker cyan" cx="112" cy="100" r="4"/><circle class="marker cyan" cx="55" cy="124" r="4"/></g>
<g class="star" data-star="v1"><circle class="marker violet" cx="168" cy="100" r="4"/></g>
<g class="star" data-star="v2"><circle class="marker violet" cx="210" cy="20" r="4"/></g>
<g class="star" data-star="v3"><circle class="marker violet" cx="238" cy="43" r="4"/></g>
<g class="star" data-star="v4"><circle class="marker violet" cx="259" cy="68" r="4"/></g>
<g class="star" data-star="v5"><circle class="marker violet" cx="192" cy="79" r="4"/></g>
<g class="star" data-star="v6"><circle class="marker violet" cx="198" cy="123" r="4"/></g>
<g class="star" data-star="v7"><circle class="marker violet" cx="225" cy="124" r="4"/></g>
<g id="mirror-guides" hidden aria-hidden="true">
  <path class="mirror-guide" d="M42 43 H238 M88 79 H192 M112 100 H168 M55 124 H225"/>
 </g>

</svg>
<button type="button" id="axis-hit" aria-pressed="false" aria-label="切换蝴蝶镜像参考" ></button>
</div></div></section></main>
<script src="./metrics.js"></script><script src="./case.js"></script>
<script>
(() => {
  const line=document.querySelector('#axis-hit');
  const guides=document.querySelector('#mirror-guides');
  const points=[...document.querySelectorAll('[data-star]')];
  const match=new Set(['v1','v3','v5','v7']);
  let on=false;
  function toggle(){
    on=!on;
    guides.toggleAttribute('hidden',!on);
    for(const point of points){
      point.classList.toggle('matched',on&&match.has(point.dataset.star));
      point.classList.toggle('unmatched',on&&!match.has(point.dataset.star));
    }
    line.setAttribute('aria-pressed',String(on));
    if(on)NB.notice('mirror');
  }
  line.addEventListener('click',toggle);
  line.addEventListener('keydown',event=>{
    if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle()}
  });
})();
</script></body></html>
