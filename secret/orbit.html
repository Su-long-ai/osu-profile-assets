<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>036js</title><link rel="stylesheet" href="./silent.css?v=25"></head><body>
<main class="shell"><a class="breadcrumb" href="./" aria-label="返回图集"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M21 14H6m0 0 6-6m-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<section class="workbench" aria-label="蝴蝶星点"><div class="visual"><div class="star-wrap">
<svg class="star-field" viewBox="0 0 280 160" id="star-map" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="蝴蝶星图。沿中央虚线观察镜像，再从右侧七颗星中找出四颗与左侧对称的星">
<path class="edge" d="M140 88 L42 43 L88 79 L55 124 L112 100 L140 88 L168 100 L192 79 L238 43 L259 68 L225 124 L198 123 L140 88"/>
<line class="axis" x1="140" y1="12" x2="140" y2="146"/>
<circle id="axis-beacon" cx="140" cy="60" r="2.5" aria-hidden="true"/>
<g class="star"><circle class="marker cyan" cx="42" cy="43" r="4"/><circle class="marker cyan" cx="88" cy="79" r="4"/><circle class="marker cyan" cx="112" cy="100" r="4"/><circle class="marker cyan" cx="55" cy="124" r="4"/></g>
<g class="star" data-star="v1" role="button" tabindex="0" aria-pressed="false" aria-label="第1颗紫色星点"><circle class="star-hit" cx="168" cy="100" r="12"/><circle class="marker violet" cx="168" cy="100" r="4"/></g>
<g class="star" data-star="v2" role="button" tabindex="0" aria-pressed="false" aria-label="第2颗紫色星点"><circle class="star-hit" cx="210" cy="20" r="12"/><circle class="marker violet" cx="210" cy="20" r="4"/></g>
<g class="star" data-star="v3" role="button" tabindex="0" aria-pressed="false" aria-label="第3颗紫色星点"><circle class="star-hit" cx="238" cy="43" r="12"/><circle class="marker violet" cx="238" cy="43" r="4"/></g>
<g class="star" data-star="v4" role="button" tabindex="0" aria-pressed="false" aria-label="第4颗紫色星点"><circle class="star-hit" cx="259" cy="68" r="12"/><circle class="marker violet" cx="259" cy="68" r="4"/></g>
<g class="star" data-star="v5" role="button" tabindex="0" aria-pressed="false" aria-label="第5颗紫色星点"><circle class="star-hit" cx="192" cy="79" r="12"/><circle class="marker violet" cx="192" cy="79" r="4"/></g>
<g class="star" data-star="v6" role="button" tabindex="0" aria-pressed="false" aria-label="第6颗紫色星点"><circle class="star-hit" cx="198" cy="123" r="12"/><circle class="marker violet" cx="198" cy="123" r="4"/></g>
<g class="star" data-star="v7" role="button" tabindex="0" aria-pressed="false" aria-label="第7颗紫色星点"><circle class="star-hit" cx="225" cy="124" r="12"/><circle class="marker violet" cx="225" cy="124" r="4"/></g>
<g id="mirror-guides" hidden aria-hidden="true">
  <path class="mirror-guide" d="M42 43 H140 M88 79 H140 M112 100 H140 M55 124 H140"/>
 </g>

</svg>
<button type="button" id="axis-hit" aria-pressed="false" aria-label="显示或隐藏镜像观察轴" ></button>
</div>
<svg id="star-progress" class="star-progress" viewBox="0 0 110 18" aria-label="已选择的对称星点数量" xmlns="http://www.w3.org/2000/svg">
  <circle cx="16" cy="9" r="2.3"/><circle cx="42" cy="9" r="2.3"/><circle cx="68" cy="9" r="2.3"/><circle cx="94" cy="9" r="2.3"/>
</svg>
<p class="sr-only" id="star-status" role="status" aria-live="polite"></p>
</div></section></main>
<script src="./metrics.js"></script><script src="./case.js"></script><script src="./fragments.js?v=4"></script>
<script>
(() => {
  const axis=document.querySelector('#axis-hit');
  const guides=document.querySelector('#mirror-guides');
  const beacon=document.querySelector('#axis-beacon');
  const points=[...document.querySelectorAll('[data-star]')];
  const progress=document.querySelector('#star-progress');
  const pips=[...progress.querySelectorAll('circle')];
  const status=document.querySelector('#star-status');
  const wrap=document.querySelector('.star-wrap');
  const matches=new Set(['v1','v3','v5','v7']);
  const visualKey='nb036-visual-v1:mirror';
  const chosenKey='nb036-visual-v2:star-selection';
  const saved=localStorage.getItem(visualKey);
  let on=saved===null?NB.seen('mirror'):saved==='1';
  const recorded=JSON.parse(localStorage.getItem(chosenKey)||'[]');
  let chosen=new Set(Array.isArray(recorded)?recorded.filter(id=>points.some(p=>p.dataset.star===id)):[]);
  // Older versions allowed five or more selections while showing four pips.
  // Normalize that impossible-to-read state without erasing the first choices.
  if(chosen.size>4) {
    chosen=new Set([...chosen].slice(0,4));
    localStorage.setItem(chosenKey,JSON.stringify([...chosen]));
  }
  if(NB.seen('mirror'))chosen=new Set(matches);

  function paint(){
    const solved=NB.seen('mirror');
    guides.toggleAttribute('hidden',!on);
    beacon.toggleAttribute('hidden',on);
    wrap.classList.toggle('mirror-open',on);
    for(const point of points){
      const id=point.dataset.star;
      const selected=chosen.has(id);
      point.classList.toggle('chosen',on&&selected&&!solved);
      point.classList.toggle('matched',on&&solved&&matches.has(id));
      point.classList.toggle('unmatched',on&&solved&&!matches.has(id));
      point.setAttribute('aria-pressed',String(on&&(selected||solved&&matches.has(id))));
    }
    pips.forEach((pip,i)=>pip.classList.toggle('on',i<chosen.size));
    axis.setAttribute('aria-pressed',String(on));
  }
  function flip(){
    on=!on;
    localStorage.setItem(visualKey,on?'1':'0');
    paint();
  }
  axis.addEventListener('click',flip);

  function choose(id){
    if(NB.seen('mirror'))return;
    if(!on){
      on=true;
      localStorage.setItem(visualKey,'1');
    }
    if(!chosen.has(id) && chosen.size===4) {
      progress.classList.remove('limit');
      void progress.getBoundingClientRect().width;
      progress.classList.add('limit');
      status.textContent='已选满四颗星。先取消一个，再选择其他星点。';
      return;
    }
    progress.classList.remove('limit');
    wrap.classList.remove('near-miss');
    if(chosen.has(id))chosen.delete(id);
    else chosen.add(id);
    localStorage.setItem(chosenKey,JSON.stringify([...chosen]));
    status.textContent='当前已选中'+chosen.size+'颗星';
    if(chosen.size===4){
      const correct=[...chosen].every(x=>matches.has(x));
      if(correct){
        NB.notice('mirror');
        chosen=new Set(matches);
        status.textContent='四颗星点对称，星图已经完成';
      } else {
        wrap.classList.add('near-miss');
        status.textContent='四颗星的位置尚不对称，可以取消其中一颗重选';
      }
    }
    paint();
  }
  for(const point of points){
    point.addEventListener('click',()=>choose(point.dataset.star));
    point.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){
        event.preventDefault();
        choose(point.dataset.star);
      }
    });
  }
  // On narrow phones, the visible dots have tiny SVG bounds. Resolve a tap
  // close to a dot to the NEAREST candidate, without overlapping targets or
  // making blank sky interactive. SVG positions stay the source of truth.
  const field=document.querySelector('#star-map');
  field.addEventListener('click',event=>{
    if(event.target.closest('[data-star]'))return;
    const matrix=field.getScreenCTM();
    if(!matrix)return;
    const pointer=field.createSVGPoint();
    pointer.x=event.clientX;
    pointer.y=event.clientY;
    const point=pointer.matrixTransform(matrix.inverse());
    if(point.x<140)return;
    let nearest=null,distance=Infinity;
    for(const star of points){
      const marker=star.querySelector('.marker');
      const dx=point.x-Number(marker.getAttribute('cx'));
      const dy=point.y-Number(marker.getAttribute('cy'));
      const dist=Math.hypot(dx,dy);
      if(dist<distance){distance=dist;nearest=star}
    }
    if(distance<=22&&nearest)choose(nearest.dataset.star);
  });
  paint();
})();
</script></body></html>
