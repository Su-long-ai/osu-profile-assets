<script>
(() => {
  const line = document.querySelector('#axis-hit');
  const caption = document.querySelector('#wing-note');
  const pairs = ['v1','v3','v5','v7'];
  const others = ['v2','v4','v6'];
  const stars = [...document.querySelectorAll('[data-star]')];
  let showing = false;
  function toggleMirror() {
    showing = !showing;
    for (const star of stars) {
      const id = star.dataset.star;
      star.classList.toggle('matched', showing && pairs.includes(id));
      star.classList.toggle('unmatched', showing && others.includes(id));
    }
    caption.hidden = !showing;
    if (showing) NB.notice('mirror');
  }
  line.addEventListener('click', toggleMirror);
  line.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      toggleMirror();
    }
  });
})();
</script>
