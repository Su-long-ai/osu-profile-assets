<script>
(() => {
  const keys = [...document.querySelectorAll('[data-lane]')];
  const note = document.querySelector('#margin-note');
  let held = '';
  function tap(letter) {
    if (!'DFJK'.includes(letter)) return;
    const button = keys.find(x => x.dataset.lane === letter);
    button?.classList.add('tapped');
    setTimeout(() => button?.classList.remove('tapped'), 170);
    if (!note.hidden) return;
    const target = 'JKDF'; // Not displayed or framed as a mission.
    held = target.startsWith(held + letter) ? held + letter : letter === target[0] ? letter : '';
    if (held === target) {
      note.hidden = false;
      NB.notice('keys');
    }
  }
  keys.forEach(key => {
    key.addEventListener('click', () => tap(key.dataset.lane));
    key.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        tap(key.dataset.lane);
      }
    });
  });
  document.addEventListener('keydown', event => {
    if (event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) return;
    tap(event.key.toUpperCase());
  });
  if (NB.seen('keys')) note.hidden = false;
})();
</script>
