<script>
(() => {
  const target=['J','K','D','F'];
  const lanes=['S','D','F','SPACE','J','K','L'];
  const sequenceKey='nb036-visual-v4:key-sequence';
  const legacyKey='nb036-visual-v3:key-prefix';
  function loadSequence(){
    try{
      const parsed=JSON.parse(localStorage.getItem(sequenceKey)||'null');
      if(Array.isArray(parsed)&&parsed.length<4&&parsed.every(x=>lanes.includes(x)))return parsed;
    }catch{}
    const legacy=localStorage.getItem(legacyKey)||'';
    if(legacy && legacy.length<4 && target.join('').startsWith(legacy)){
      const migrated=[...legacy];
      localStorage.setItem(sequenceKey,JSON.stringify(migrated));
      localStorage.removeItem(legacyKey);
      return migrated;
    }
    localStorage.removeItem(legacyKey);
    localStorage.removeItem(sequenceKey);
    return [];
  }
  let entered=loadSequence();
  let evaluating=false;
  const glow=document.querySelector('#afterglow');
  const grid=document.querySelector('#beat-grid');
  const progress=document.querySelector('#key-progress');
  const pips=[...progress.querySelectorAll('circle')];
  const echoes=[...document.querySelectorAll('.phrase-echo')];
  const status=document.querySelector('#rhythm-status');
  const buttons=[...document.querySelectorAll('[data-lane]')];

  function solved(){return NB.seen('keys') || !glow.hasAttribute('hidden')}
  function persist(){
    if(entered.length)localStorage.setItem(sequenceKey,JSON.stringify(entered));
    else localStorage.removeItem(sequenceKey);
  }
  function renderProgress(){
    const done=solved();
    grid.classList.toggle('archival',done);
    buttons.forEach(button=>{
      button.tabIndex=done?-1:0;
      button.setAttribute('aria-disabled',String(done));
    });
    pips.forEach((pip,i)=>pip.classList.toggle('on',!done&&i<entered.length));
    echoes.forEach((echo,i)=>{
      const lane=entered[i];
      echo.toggleAttribute('hidden',done||!lane);
      if(lane)echo.setAttribute('x',String(24+lanes.indexOf(lane)*46));
    });
    document.querySelectorAll('.hold-note').forEach(note=>{
      note.tabIndex=done?-1:0;
      note.setAttribute('aria-disabled',String(done));
      const accepted=done&&target.includes(note.dataset.hold);
      note.classList.toggle('accepted',accepted);
      note.setAttribute('aria-pressed',String(accepted));
    });
  }
  function complete(){
    entered=[...target];
    evaluating=false;
    localStorage.removeItem(sequenceKey);
    localStorage.removeItem(legacyKey);
    progress.classList.remove('wrong-order');
    grid.classList.add('recovered');
    progress.setAttribute('hidden','');
    glow.removeAttribute('hidden');
    renderProgress();
  }
  function reject(){
    evaluating=true;
    document.dispatchEvent(new Event('nb:rhythm-rejected'));
    progress.classList.add('wrong-order');
    grid.classList.add('phrase-rejected');
    status.textContent='四次输入未形成主页乐句，可打开右上角放大图回看主页七轨印记';
    setTimeout(()=>{
      entered=[];
      evaluating=false;
      progress.classList.remove('wrong-order');
      grid.classList.remove('phrase-rejected');
      persist();
      renderProgress();
    },430);
  }
  function tap(letter){
    const button=buttons.find(x=>x.dataset.lane===letter);
    if(!button||evaluating||solved())return;
    button.classList.add('tapped');
    setTimeout(()=>button.classList.remove('tapped'),230);
    const note=document.querySelector('[data-hold="'+letter+'"]');
    note?.classList.add('touched');
    setTimeout(()=>note?.classList.remove('touched'),300);
    entered.push(letter);
    renderProgress();
    status.textContent='已记录'+entered.length+'次输入';
    if(entered.length<4){persist();return}
    localStorage.removeItem(sequenceKey);
    if(target.every((x,i)=>entered[i]===x)){
      complete();
      NB.notice('keys');
    }else reject();
  }
  for(const button of buttons){
    button.addEventListener('click',()=>tap(button.dataset.lane));
    button.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){event.preventDefault();tap(button.dataset.lane)}
    });
  }
  for(const note of document.querySelectorAll('.hold-note')){
    note.addEventListener('click',()=>tap(note.dataset.hold));
    note.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){event.preventDefault();tap(note.dataset.hold)}
    });
  }
  document.addEventListener('keydown',event=>{
    if(event.defaultPrevented||event.repeat||event.ctrlKey||event.altKey||event.metaKey)return;
    if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;
    const key=event.code==='Space'?'SPACE':event.key.toUpperCase();
    if(key==='SPACE')event.preventDefault();
    tap(key);
  });
  if(NB.seen('keys'))complete();
  else renderProgress();
})();
</script><script src="./echo.js?v=1"></script><script src="./source-lens.js?v=2"></script><script src="./registration-residue.js?v=7"></script><script src="./return-echo.js?v=1"></script><script src="./post-return.js?v=1"></script></body></html>
