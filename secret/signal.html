<script src="./metrics.js"></script><script src="./case.js"></script><script src="./fragments.js?v=5"></script>
<script>
(() => {
  const target='JKDF';
  const partialKey='nb036-visual-v3:key-prefix';
  const saved=localStorage.getItem(partialKey)||'';
  let entered=target.startsWith(saved)&&saved.length<target.length?saved:'';
  const glow=document.querySelector('#afterglow');
  const progress=document.querySelector('#key-progress');
  const pips=[...progress.querySelectorAll('circle')];
  const status=document.querySelector('#rhythm-status');
  let feedbackTimer;
  const buttons=[...document.querySelectorAll('[data-lane]')];
  function renderProgress() {
    pips.forEach((pip,i)=>pip.classList.toggle('on',i<entered.length));
    document.querySelectorAll('.hold-note').forEach(note=>{
      const accepted=entered.includes(note.dataset.hold);
      note.classList.toggle('accepted',accepted);
      note.setAttribute('aria-pressed',String(accepted));
    });
  }
  function complete() {
    entered=target;
    renderProgress();
    localStorage.removeItem(partialKey);
    progress.setAttribute('hidden','');
    glow.removeAttribute('hidden');
  }
  function tap(letter) {
    const button=buttons.find(x=>x.dataset.lane===letter);
    if (!button) return;
    button.classList.add('tapped');
    setTimeout(()=>button.classList.remove('tapped'),230);
    const matchingNote=document.querySelector('[data-hold="'+letter+'"]');
    matchingNote?.classList.add('touched');
    setTimeout(()=>matchingNote?.classList.remove('touched'),300);
    if (NB.seen('keys') || !glow.hasAttribute('hidden')) return;
    const correct=target.startsWith(entered+letter);
    entered=correct?entered+letter:letter===target[0]?letter:'';
    clearTimeout(feedbackTimer);
    progress.classList.toggle('wrong-order',!correct);
    if(!correct)feedbackTimer=setTimeout(()=>progress.classList.remove('wrong-order'),420);
    status.textContent=correct?'已正确输入'+entered.length+'个音符':('顺序不符，'+(entered?'已从第一个音符重新开始':'请重新观察音符的排列'));
    renderProgress();
    if(entered===target){complete();NB.notice('keys')}
    else if(entered)localStorage.setItem(partialKey,entered);
    else localStorage.removeItem(partialKey);
  }
  for (const button of buttons) {
    button.addEventListener('click',()=>tap(button.dataset.lane));
    button.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){event.preventDefault();tap(button.dataset.lane)}
    });
  }
  // The long note shapes themselves are the actual readable sequence.
  // Tapping a note must work exactly like pressing its lane: otherwise
  // the strongest visual cue on the page is inexplicably non-interactive.
  for(const note of document.querySelectorAll('.hold-note')){
    note.addEventListener('click',()=>tap(note.dataset.hold));
    note.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){
        event.preventDefault();
        tap(note.dataset.hold);
      }
    });
  }
  document.addEventListener('keydown',event=>{
    if(event.repeat||event.ctrlKey||event.altKey||event.metaKey)return;
    if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;
    tap(event.key.toUpperCase());
  });
  if(NB.seen('keys'))complete();
  else renderProgress();
})();
</script></body></html>
