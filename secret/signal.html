</main><script src="./metrics.js"></script><script src="./case.js"></script><script>
(() => {
 const solution=document.getElementById('solution');
 const feedback=document.getElementById('feedback');
 const answer='JKDF';
 let entered='';
 function show(){if(NB.solved('signal')){feedback.textContent='这段可以读通了。';NB.reveal(solution)}}
 function play(key){
   if(NB.solved('signal')||!answer.includes(key))return;
   entered=(answer.startsWith(entered+key)?entered+key:(key===answer[0]?key:''));
   feedback.textContent=Array.from({length:4},(_,i)=>i<entered.length?'●':'·').join(' ');
   if(entered===answer){NB.complete('signal');show()}
 }
 for(const btn of document.querySelectorAll('[data-key]'))btn.addEventListener('click',()=>play(btn.dataset.key));
 document.addEventListener('keydown',event=>{
   if(event.repeat||event.altKey||event.ctrlKey||event.metaKey||/input|textarea|select/i.test(document.activeElement?.tagName||''))return;
   const k=event.key.toUpperCase();if(answer.includes(k))play(k);
 });
 show();
})();
</script></body></html>
