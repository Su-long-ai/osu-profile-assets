</main><script src="./metrics.js"></script><script src="./case.js"></script><script>
(() => {
 const grid=document.getElementById('beat-grid');
 const chart={
  D:{3:'tap',6:'hold'},F:{1:'tap',5:'tap',7:'hold'},
  J:{2:'hold',8:'tap'},K:{4:'hold',6:'tap'}
 };
 const heading=document.createElement('span');heading.className='tick';heading.textContent='';grid.append(heading);
 for(let t=1;t<=8;t++){const n=document.createElement('span');n.className='tick';n.textContent=String(t).padStart(2,'0');grid.append(n)}
 for(const lane of 'DFJK'){
   const label=document.createElement('span');label.className='lane-name';label.textContent=lane;grid.append(label);
   for(let t=1;t<=8;t++){
     const slot=document.createElement('span');slot.className='slot';
     const type=chart[lane][t];
     slot.setAttribute('aria-label',lane+' lane beat '+t+': '+(type||'rest'));
     if(type){const mark=document.createElement('span');mark.className='note '+(type==='hold'?'long':'');slot.append(mark)}
     else slot.classList.add('rest');
     grid.append(slot);
   }
 }
 const solution=document.getElementById('solution');
 const feedback=document.getElementById('feedback');
 const answer='JKDF';
 let entered='';
 function show(){if(NB.solved('signal')){feedback.textContent='这段可以读通了。';NB.reveal(solution)}}
 function play(key){
   if(NB.solved('signal')||!answer.includes(key))return;
   entered=(answer.startsWith(entered+key)?entered+key:(key===answer[0]?key:''));
   feedback.textContent=Array.from({length:4},(_,i)=>i<entered.length?'●':'·').join(' ');
   if(entered===answer){NB.complete('signal');show()}
 }
 for(const btn of document.querySelectorAll('[data-key]'))btn.addEventListener('click',()=>play(btn.dataset.key));
 document.addEventListener('keydown',event=>{
   if(event.repeat||event.altKey||event.ctrlKey||event.metaKey||/input|textarea|select/i.test(document.activeElement?.tagName||''))return;
   const k=event.key.toUpperCase();if(answer.includes(k))play(k);
 });
 show();
})();
</script></body></html>
