<body><main class="shell">
<a href="./" class="breadcrumb" aria-label="返回图集"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M21 14H6m0 0 6-6m-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
<section class="workbench" aria-label="四轨图形">
 <div class="visual">
 <svg id="beat-grid" class="roll" viewBox="0 0 228 247" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="四轨长音符图；可按四个轨道上方或使用 DFJK 键盘互动">
<defs><linearGradient id="hold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b4dfe4"/><stop offset="1" stop-color="#557f8e"/></linearGradient></defs>
<rect x="32" y="35" width="181" height="197" rx="2" fill="#10151d"/>
<g stroke="#334554" stroke-width=".7">
  <path d="M77 35V232 M122 35V232 M167 35V232 M32 35V232 M213 35V232"/>
  <path d="M32 60H213 M32 84H213 M32 108H213 M32 132H213 M32 156H213 M32 180H213 M32 204H213 M32 228H213" opacity=".55"/>
</g>


<!-- short taps: not part of the four-note message -->
<g fill="#607d90"><rect x="81" y="44" width="36" height="5" rx="1"/>
<rect x="36" y="92" width="36" height="5" rx="1"/>
<rect x="81" y="140" width="36" height="5" rx="1"/>
<rect x="171" y="164" width="36" height="5" rx="1"/>
<rect x="126" y="212" width="36" height="5" rx="1"/></g>
<!-- four sustained note objects -->
<g fill="url(#hold)" stroke="#a4d3dd" stroke-width=".5">
 <rect x="127" y="66" width="34" height="39" rx="2"/>
 <rect x="172" y="114" width="34" height="39" rx="2"/>
 <rect x="37" y="162" width="34" height="39" rx="2"/>
 <rect x="82" y="186" width="34" height="39" rx="2"/>
</g>
<g fill="#d0f0ee">
 <rect x="127" y="66" width="34" height="5" rx="1"/>
 <rect x="172" y="114" width="34" height="5" rx="1"/>
 <rect x="37" y="162" width="34" height="5" rx="1"/>
 <rect x="82" y="186" width="34" height="5" rx="1"/>
</g>
<g class="lane-button" data-lane="D" role="button" tabindex="0" aria-label="按 D"><rect x="32" y="0" width="45" height="34"/></g>
<g class="lane-button" data-lane="F" role="button" tabindex="0" aria-label="按 F"><rect x="77" y="0" width="45" height="34"/></g>
<g class="lane-button" data-lane="J" role="button" tabindex="0" aria-label="按 J"><rect x="122" y="0" width="45" height="34"/></g>
<g class="lane-button" data-lane="K" role="button" tabindex="0" aria-label="按 K"><rect x="167" y="0" width="46" height="34"/></g>
</svg>
 <svg id="afterglow" class="afterglow" viewBox="0 0 130 27" xmlns="http://www.w3.org/2000/svg" aria-label="隐藏的光点" hidden>
 <circle cx="27" cy="14" r="2.5"/><circle cx="54" cy="14" r="1.5"/><circle cx="81" cy="14" r="2.5"/><circle cx="108" cy="14" r="1.5"/>
 <path d="M27 14 54 14 81 14 108 14" stroke="#7b9aaa" stroke-width=".7" stroke-dasharray="2 6"/>
 </svg>
 </div>
</section>
</main>
<script src="./metrics.js"></script><script src="./case.js"></script>
<script>
(() => {
  let entered = '';
  const target='JKDF';
  const glow=document.querySelector('#afterglow');
  const buttons=[...document.querySelectorAll('[data-lane]')];
  function tap(letter) {
    const button=buttons.find(x=>x.dataset.lane===letter);
    if (!button) return;
    button.classList.add('tapped');
    setTimeout(()=>button.classList.remove('tapped'),170);
    if (!glow.hasAttribute('hidden')) return;
    entered=target.startsWith(entered+letter)?entered+letter:letter===target[0]?letter:'';
    if(entered===target){glow.removeAttribute('hidden');NB.notice('keys')}
  }
  for (const button of buttons) {
    button.addEventListener('click',()=>tap(button.dataset.lane));
    button.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){event.preventDefault();tap(button.dataset.lane)}
    });
  }
  document.addEventListener('keydown',event=>{
    if(event.repeat||event.ctrlKey||event.altKey||event.metaKey)return;
    if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;
    tap(event.key.toUpperCase());
  });
  if(NB.seen('keys'))glow.removeAttribute('hidden');
})();
</script></body></html>
