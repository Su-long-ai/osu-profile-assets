name: Secret archive analytics smoke
on:
  push:
    paths:
      - '.github/workflows/secret-analytics-smoke.yml'
      - 'secret/metrics.js'
      - 'secret/index.html'
      - 'secret/stats.html'
      - 'secret/case.css'
      - 'secret/case.js'
      - 'secret/signal.html'
      - 'secret/chronicle.html'
      - 'secret/orbit.html'
      - 'secret/sealed.html'
      - 'secret/tape.html'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check secret/metrics.js
      - name: Validate nonlinear case files and preserve legacy tape
        shell: bash
        run: |
          set -euo pipefail
          node --check secret/case.js
          node - <<'JS'
          const fs=require('fs');
          const files=['index','signal','chronicle','orbit','sealed','tape','stats'];
          const read=n=>fs.readFileSync('secret/'+n+'.html','utf8');
          for(const name of files){
            const html=read(name);
            for(const match of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)){
              if(match[1].trim())new Function(match[1]);
            }
            if(!html.includes('</html>'))throw Error('Missing closing document: '+name);
            console.log('PASS: '+name+' markup and JS syntax');
          }
          const hub=read('index');
          for(const route of ['signal.html','chronicle.html','orbit.html','sealed.html','tape.html'])
            if(!hub.includes(route))throw Error('Hub missing '+route);
          const tape=read('tape');
          if(!tape.includes('id="e-side"')||!tape.includes('data-digit="6"'))throw Error('Legacy E-Side lost');
          const shared=fs.readFileSync('secret/case.js','utf8');
          if(!shared.includes("branches=['signal','chronicle','orbit']"))throw Error('Missing independent branches');
          if(!read('sealed').includes("form.hidden=found<2")||!read('sealed').includes("if(found===3)")||!read('sealed').includes("code.value.trim()==='0529'"))throw Error('Two-of-three checksum and true-ending gates missing');
          const dashboard=read('stats');
          for(const stage of ['case-signal','case-chronicle','case-orbit','case-final','case-true'])
            if(!dashboard.includes(stage))throw Error('Missing stats stage '+stage);
          console.log('PASS: independent file routes, two-of-three seal, true ending, legacy preservation and metrics');
          JS
      - name: Test alternative free count API (write/read, CORS)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 15 -H 'Origin: https://su-long-ai.github.io' -D /tmp/cors.txt \
            'https://countapi.mileshilliard.com/api/v1/hit/archive036_smoketest_unique' \
            -o /tmp/counter-write.json
          curl -fsSL --retry 2 --max-time 15 \
            'https://countapi.mileshilliard.com/api/v1/get/archive036_smoketest_unique' \
            -o /tmp/counter-read.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          write=json.loads(Path('/tmp/counter-write.json').read_text())
          read=json.loads(Path('/tmp/counter-read.json').read_text())
          assert isinstance(write.get('value'),(int,float)), write
          assert isinstance(read.get('value'),(int,float)), read
          print('PASS: write accepted and unique read returned numeric counts')
          print('Test counter:',write['value'],'Unique counter:',read['value'])
          PY
          if ! grep -Eqi '^access-control-allow-origin: (\*|https://su-long-ai.github.io)' /tmp/cors.txt; then
            echo "WARNING: Counter responded but CORS origin header was not detected"
            grep -i '^access-control-' /tmp/cors.txt || true
            exit 1
          fi
          echo 'PASS: browser CORS header present'
          # Read-only probe of a stage key that may have zero recorded unlocks.
          code=$(curl -sSL --max-time 12 -w '%{http_code}' -o /tmp/unused-count.json 'https://countapi.mileshilliard.com/api/v1/get/archive036_20261113_b_side')
          echo "Initial B-Side read HTTP status: $code"
          head -c 250 /tmp/unused-count.json || true
          echo

