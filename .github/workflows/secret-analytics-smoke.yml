name: Secret archive analytics smoke
on:
  push:
    paths:
      - '.github/workflows/secret-analytics-smoke.yml'
      - 'secret/metrics.js'
      - 'secret/index.html'
      - 'secret/stats.html'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check secret/metrics.js
      - name: Verify deployed E-Side files and JS syntax
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('secret/index.html','utf8');
          const script=html.match(/<script>\s*([\s\S]*?)<\/script>/);
          if(!script) throw new Error('Missing inline script');
          new Function(script[1]);
          if(!html.includes('id="e-side"')||!html.includes('data-digit="6"'))throw new Error('E-side missing');
          console.log('PASS: E-Side inline JavaScript syntax and markup');
          JS
          live='https://su-long-ai.github.io/osu-profile-assets/secret/'
          stats='https://su-long-ai.github.io/osu-profile-assets/secret/stats.html'
          for attempt in {1..10}; do
            curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' "$live?smoke=$GITHUB_SHA" -o /tmp/live-secret.html || true
            curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' "$stats?smoke=$GITHUB_SHA" -o /tmp/live-stats.html || true
            if grep -q 'id="e-side"' /tmp/live-secret.html && grep -q 'id="e-side"' /tmp/live-stats.html; then
              echo "PASS: E-Side present on publicly deployed site and stats"
              exit 0
            fi
            echo "Deployment not yet visible, attempt $attempt"
            sleep 3
          done
          echo 'GitHub Pages latest E-Side files did not become visible'
          exit 1
      - name: Test alternative free count API (write/read, CORS)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 15 -H 'Origin: https://su-long-ai.github.io' -D /tmp/cors.txt \
            'https://countapi.mileshilliard.com/api/v1/hit/archive036_smoketest_unique' \
            -o /tmp/counter-write.json
          curl -fsSL --retry 2 --max-time 15 \
            'https://countapi.mileshilliard.com/api/v1/get/archive036_smoketest_unique' \
            -o /tmp/counter-read.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          write=json.loads(Path('/tmp/counter-write.json').read_text())
          read=json.loads(Path('/tmp/counter-read.json').read_text())
          assert isinstance(write.get('value'),(int,float)), write
          assert isinstance(read.get('value'),(int,float)), read
          print('PASS: write accepted and unique read returned numeric counts')
          print('Test counter:',write['value'],'Unique counter:',read['value'])
          PY
          if ! grep -Eqi '^access-control-allow-origin: (\*|https://su-long-ai.github.io)' /tmp/cors.txt; then
            echo "WARNING: Counter responded but CORS origin header was not detected"
            grep -i '^access-control-' /tmp/cors.txt || true
            exit 1
          fi
          echo 'PASS: browser CORS header present'
          # Read-only probe of a stage key that may have zero recorded unlocks.
          code=$(curl -sSL --max-time 12 -w '%{http_code}' -o /tmp/unused-count.json 'https://countapi.mileshilliard.com/api/v1/get/archive036_20261113_b_side')
          echo "Initial B-Side read HTTP status: $code"
          head -c 250 /tmp/unused-count.json || true
          echo

