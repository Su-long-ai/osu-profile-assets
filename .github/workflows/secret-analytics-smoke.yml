name: 036js misc source check
on:
  push:
    paths:
      - '.github/workflows/secret-analytics-smoke.yml'
      - 'secret/*.html'
      - 'secret/*.js'
      - 'secret/case.css'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check embedded scripts and links
        shell: bash
        run: |
          set -euo pipefail
          node --check secret/metrics.js
          node --check secret/case.js
          node - <<'JS'
          const fs=require('fs');
          const names=['index','signal','chronicle','orbit','sealed','stats','tape'];
          const read=name=>fs.readFileSync('secret/'+name+'.html','utf8');
          for(const name of names){
            const html=read(name);
            if(!html.includes('</html>'))throw Error(name+' truncated');
            for(const block of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g))
              if(block[1].trim())new Function(block[1]);
          }
          const hub=read('index');
          for(const target of ['signal.html','chronicle.html','orbit.html','sealed.html','tape.html','stats.html'])
            if(!hub.includes(target))throw Error('Missing link '+target);
          const signal=read('signal');
          if(!signal.includes('data-lane="D"')||!signal.includes('data-lane="K"'))throw Error('4K keys missing');
          const dates=read('chronicle');
          if(!dates.includes('2025.12.26')||!dates.includes('2026.05.29'))throw Error('Recorded milestones missing');
          for(const phantom of ['2025.03.07','2025.05.27'])
            if(dates.includes(phantom))throw Error('Unsupported date '+phantom);
          if(!read('orbit').includes('id="axis-hit"'))throw Error('Doodle fold-line missing');
          if(!read('sealed').includes('id="scribble"'))throw Error('Marginal note missing');
          if(read('sealed').includes('verify-form'))throw Error('Old quest gate remains');
          if(!read('tape').includes('id="e-side"'))throw Error('Old archived page damaged');
          const metrics=fs.readFileSync('secret/metrics.js','utf8');
          const stats=read('stats');
          for(const id of ['misc-keys','misc-dates','misc-mirror','misc-margin'])
            if(!metrics.includes(id)||!stats.includes(id))throw Error('Missing discovery counter '+id);
          console.log('PASS: 036js misc, no fabricated dates or quest gate, historical site preserved');
          JS
      - name: Read-only counter service check (optional)
        continue-on-error: true
        run: |
          curl -fsSL --retry 1 --max-time 12 \
            'https://countapi.mileshilliard.com/api/v1/get/archive036_smoketest_unique' \
            | python3 -c 'import json,sys; print("Counter:",json.load(sys.stdin).get("value"))'
