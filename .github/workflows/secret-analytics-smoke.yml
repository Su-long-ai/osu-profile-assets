name: 036js silent source check
on:
  push:
    paths:
      - '.github/workflows/secret-analytics-smoke.yml'
      - 'secret/*.html'
      - 'secret/*.js'
      - 'secret/case.css'
      - 'secret/silent.css'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check embedded scripts and links
        shell: bash
        run: |
          set -euo pipefail
          node --check secret/metrics.js
          node --check secret/case.js
          node --check secret/fragments.js
          node --check secret/assembly.js
          node --check secret/browser_smoke.cjs
          node - <<'JS'
          const fs=require('fs');
          const names=['index','signal','chronicle','orbit','sealed','finale','stats','tape'];
          const read=name=>fs.readFileSync('secret/'+name+'.html','utf8');
          for(const name of names){
            const html=read(name);
            if(!html.includes('</html>'))throw Error(name+' truncated');
            for(const block of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g))
              if(block[1].trim())new Function(block[1]);
          }
          // Every currently linked page is intentionally nonverbal. Preserve
          // aria-labels for assistive technology; they are not visible prose.
          for (const name of ['index','signal','chronicle','orbit','sealed','finale','stats']){
            const stripped=read(name)
              .replace(/<head[\s\S]*?<\/head>/g,'')
              .replace(/<script(?:\s[^>]*)?>[\s\S]*?<\/script>/g,'')
              .replace(/<!--[\s\S]*?-->/g,'')
              .replace(/<[^>]+>/g,'')
              .trim();
            if(/[\p{L}]/u.test(stripped)) throw Error('Visible prose in '+name+': '+stripped.slice(0,90));
          }
          if(!fs.readFileSync('secret/silent.css','utf8').includes('.gallery'))throw Error('Gallery visual stylesheet missing');
          const hub=read('index');
          for(const target of ['signal.html','chronicle.html','orbit.html','sealed.html','finale.html','stats.html'])
            if(!hub.includes(target))throw Error('Missing link '+target);
          const signal=read('signal');
          if(!signal.includes('data-lane="D"')||!signal.includes('data-lane="K"'))throw Error('4K keys missing');
          const dates=read('chronicle');
          if(!dates.includes('2025.12.26')||!dates.includes('2026.05.29'))throw Error('Recorded milestones missing');
          for(const phantom of ['2025.03.07','2025.05.27'])
            if(dates.includes(phantom))throw Error('Unsupported date '+phantom);
          if(!read('orbit').includes('id="axis-hit"'))throw Error('Doodle fold-line missing');
          if(!read('sealed').includes('id="scribble"'))throw Error('Marginal note missing');
          if(read('sealed').includes('verify-form'))throw Error('Old quest gate remains');
          if(!read('tape').includes('id="e-side"'))throw Error('Old archived page damaged');
          const finale=read('finale');
          if(!finale.includes('class="assembly-slot"')||!finale.includes('class="assembly-piece"'))
            throw Error('Four-shard visual assembly missing');
          if(!finale.includes('assembly.js')||!hub.includes('fragments.js'))
            throw Error('Finale source linkage missing');
          const metrics=fs.readFileSync('secret/metrics.js','utf8');
          const stats=read('stats');
          for(const id of ['misc-keys','misc-dates','misc-mirror','misc-margin'])
            if(!metrics.includes(id)||!stats.includes(id))throw Error('Missing discovery counter '+id);
          console.log('PASS: zero visible prose, 4 graphic links, original milestones, retained archived site, historical statistics');
          JS
