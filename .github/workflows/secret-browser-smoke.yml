name: Archive 036 real-browser check
on:
  push:
    paths:
      - '.github/workflows/secret-browser-smoke.yml'
      - 'secret/browser_smoke.cjs'
  workflow_dispatch:

jobs:
  mobile-and-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Locate installed Chrome and prepare lightweight Puppeteer
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          npm install --prefix /tmp/nb-puppeteer --no-save --no-audit --no-fund puppeteer-core@24.15.0
      - name: Run live, no-count-inflation browser tests
        shell: bash
        env:
          NODE_PATH: /tmp/nb-puppeteer/node_modules
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          node secret/browser_smoke.cjs
      - name: Preserve mobile/desktop validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive036-responsive-review
          path: /tmp/archive036-screens/
          if-no-files-found: ignore
