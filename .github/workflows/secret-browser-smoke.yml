name: 036js misc browser check
on:
  push:
    paths:
      - '.github/workflows/secret-browser-smoke.yml'
      - 'secret/browser_smoke.cjs'
      - 'secret/index.html'
      - 'secret/signal.html'
      - 'secret/chronicle.html'
      - 'secret/orbit.html'
      - 'secret/sealed.html'
      - 'secret/case.css'
      - 'secret/case.js'
      - 'secret/stats.html'
      - 'secret/metrics.js'
  workflow_dispatch:

jobs:
  mobile-and-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Locate installed Chrome and prepare lightweight Puppeteer
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          npm install --prefix /tmp/nb-puppeteer --no-save --no-audit --no-fund puppeteer-core@24.15.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
      - name: Verify new file-view CSS is live
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 12 'https://su-long-ai.github.io/osu-profile-assets/secret/case.css?v=misc4' |
            grep -F '.log-row{display:flex'
      - name: Run live, no-count-inflation browser tests
        shell: bash
        env:
          NODE_PATH: /tmp/nb-puppeteer/node_modules
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          for attempt in 1 2 3 4; do
            if node secret/browser_smoke.cjs; then exit 0; fi
            echo "Waiting for GitHub Pages deploy/cache refresh; attempt $attempt"
            sleep 12
          done
          exit 1
      - name: Preserve mobile/desktop validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive036-responsive-review
          path: /tmp/archive036-screens/
          if-no-files-found: ignore
