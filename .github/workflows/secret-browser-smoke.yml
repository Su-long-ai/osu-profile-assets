name: 036js silent visual browser check
on:
  push:
    paths:
      - '.github/workflows/secret-browser-smoke.yml'
      - 'secret/browser_smoke.cjs'
      - 'secret/index.html'
      - 'secret/signal.html'
      - 'secret/chronicle.html'
      - 'secret/orbit.html'
      - 'secret/sealed.html'
      - 'secret/finale.html'
      - 'secret/fragments.js'
      - 'secret/assembly.js'
      - 'secret/case.css'
      - 'secret/case.js'
      - 'secret/silent.css'
      - 'secret/metrics.js'
      - 'secret/stats.html'
  workflow_dispatch:

jobs:
  mobile-and-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Locate installed Chrome and prepare lightweight Puppeteer
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          npm install --prefix /tmp/nb-puppeteer --no-save --no-audit --no-fund puppeteer-core@24.15.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
      - name: Verify silent visual stylesheet is available
        shell: bash
        run: |
          set -euo pipefail
          stylesheet="$(grep -oE 'silent\.css\?v=[0-9]+' secret/index.html)"
          test -n "$stylesheet"
          for attempt in 1 2 3 4 5 6; do
            # Download before grepping: curl|grep -q can fail via SIGPIPE
            # even when the stylesheet is valid under pipefail.
            if curl -fsSL --max-time 12 -o /tmp/nb-silent-css.css "https://su-long-ai.github.io/osu-profile-assets/secret/$stylesheet" &&
                grep -Fq '.completion-seal{' /tmp/nb-silent-css.css; then
              echo 'PASS: silent.css deployed and readable'
              exit 0
            fi
            sleep 5
          done
          echo 'CSS deployment not yet visible'
          exit 1
      - name: Run live, no-count-inflation browser tests
        shell: bash
        env:
          NODE_PATH: /tmp/nb-puppeteer/node_modules
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          for attempt in 1 2 3 4; do
            if node secret/browser_smoke.cjs; then exit 0; fi
            echo "Waiting for GitHub Pages deploy/cache refresh; attempt $attempt"
            sleep 12
          done
          exit 1
      - name: Preserve mobile/desktop validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive036-responsive-review
          path: /tmp/archive036-screens/
          if-no-files-found: ignore
